
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Supplies Ordering System</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Supplies Ordering System</h1>
        <p>Welcome to our School Supplies Shop!</p>
    </header>

    <main>

        <!-- Product List Section -->
        <section id="products">
            <h2>Product List</h2>
        </section>

        <!-- Shopping Cart Section -->
        <section id="cart">
            <h2>Shopping Cart</h2>
        </section>

        <!-- Order Summary Section -->
        <section id="summary">
            <h2>Order Summary</h2>
        </section>

        <!-- Payment Section -->
        <section id="payment">
            <h2>Payment Section</h2>
        </section>

        <!-- Receipt Section -->
        <section id="receipt">
            <h2>Receipt Section</h2>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Student Supplies Ordering System</p>
    </footer>

    <!-- Link JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
